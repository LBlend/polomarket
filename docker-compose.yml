services:
  polomarket:
    build: .
    ports:
      - "1945:3000"
    env_file: .env
    environment:
      # Override DATABASE_URL so the DB lives on the named volume, not inside the container
      DATABASE_URL: file:/data/prod.db
    volumes:
      - db_data:/data
    restart: unless-stopped

volumes:
  db_data:

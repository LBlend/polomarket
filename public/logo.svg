<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <title>Team Polomarket Mongolia Rally Logo</title>
  <defs>
    <style>
      .outer-ring { fill: none; stroke: #000; stroke-width: 40; }
      .inner-white { fill: #fff; }
      .text-top { font-family: Arial, sans-serif; font-size: 90px; font-weight: bold; fill: #000; text-anchor: middle; }
      .text-bottom { font-family: Arial, sans-serif; font-size: 60px; font-weight: bold; fill: #000; text-anchor: middle; }
    </style>
  </defs>
  <circle cx="540" cy="540" r="500" class="outer-ring"/>
  <circle cx="540" cy="540" r="480" class="inner-white"/>
  <text x="540" y="200" class="text-top">MONGOL RALLY</text>
  <text x="540" y="900" class="text-bottom">TEAM POLOMARKET</text>
</svg>